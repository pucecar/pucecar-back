<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación PUCECar</title>
</head>
<body>
  <h1>Verificación de correo</h1>
  <p>Presiona el botón para completar la validación en Firebase:</p>
  <button id="verificarBtn">Verificar correo</button>

  <script>
    // Reemplaza este link con tu Firebase OOB o endpoint dinámico si lo necesitas
    const firebaseLink = "https://www.firebase.com/tu-link-de-verificacion";

    document.getElementById("verificarBtn").addEventListener("click", () => {
      window.location.href = firebaseLink;
    });
  </script>
</body>
</html>
